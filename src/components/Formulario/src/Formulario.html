<section class="card">
    <div class="card-header">
        <h3>Componente Formulario</h3>
    </div>

    <div class="card-body">

        <form novalidate @submit.prevent="enviar">
            <!-- campo nombre -->
            <div class="form-group">
                <label for="nombre">nombre</label>
                <input 
                    id="nombre" 
                    type="text" 
                    class="form-control" 
                    v-model.trim="formData.nombre"
                    @input="formDirty.nombre=true"
                >
                <!-- cartel validación -->
                <div v-if="errorNombre.mostrar" class="alert alert-danger my-1">
                    {{ errorNombre.mensaje }}
                </div>
            </div>

            <!-- campo edad -->
            <div class="form-group">
                <label for="edad">edad</label>
                <input 
                    id="edad" 
                    type="number" 
                    class="form-control" 
                    v-model.number="formData.edad"
                    @input="formDirty.edad=true"                    
                >
                <!-- cartel validación -->
                <div v-if="errorEdad.mostrar" class="alert alert-danger my-1">
                    {{ errorEdad.mensaje }}
                </div>
            </div>

            <!-- campo email -->
            <div class="form-group">
                <label for="email">email</label>
                <input 
                    id="email" 
                    type="text" 
                    class="form-control" 
                    v-model.trim="formData.email"
                    @input="formDirty.email=true"                    
                >
                <!-- cartel validación -->
                <div v-if="errorEmail.mostrar" class="alert alert-danger my-1">
                    {{ errorEmail.mensaje }}
                </div>
            </div>

            <button class="btn btn-success my-3" :disabled="estadoBotonDeshabilitado()">Enviar</button>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                <th scope="col">#</th>
                <th scope="col">Nombre</th>
                <th scope="col">Edad</th>
                <th scope="col">email</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(persona, index) in listaPersonas" :key="index">
                <td>{{ index + 1 }}</td>
                <td>{{ persona.nombre }}</td>
                <td>{{ persona.edad }}</td>
                <td>{{ persona.email }}</td>
              </tr>
            </tbody>
        </table>

    </div>
</section>
